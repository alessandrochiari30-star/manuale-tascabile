<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manuale">
<title>Manuale</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top" hidden>
  <button type="button" id="back" class="round press" aria-label="Indietro"></button>
  <p id="sync-line" class="sync"><span class="dot"></span><span id="sync-text"></span></p>
  <span class="grow"></span>
  <button type="button" id="search-btn" class="round press" aria-label="Cerca"></button>
  <button type="button" id="settings" class="round press" aria-label="Impostazioni"></button>
  <h1 id="home-title">Cosa non<br>ricordi?</h1>
  <form id="search-form" class="searchbar" role="search" autocomplete="off">
    <span id="search-icon"></span>
    <input type="search" id="q" name="ricerca" placeholder="Cerca nel manuale" aria-label="Cerca nel manuale" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  </form>
</header>
<div id="banner" role="alert" hidden></div>
<main id="view"></main>
<nav id="tabs" aria-label="Navigazione principale" hidden>
  <a href="#/" data-tab="home"><span class="pill"></span>Home</a>
  <a href="#/cerca" data-tab="cerca"><span class="pill"></span>Cerca</a>
  <a href="#/ripasso" data-tab="ripasso"><span class="pill"></span>Ripasso</a>
  <a href="#/calc" data-tab="calc"><span class="pill"><span id="tab-badge" hidden></span></span>Proposta</a>
</nav>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" role="status" hidden></div>
<noscript>Per usare il manuale serve JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
